<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>TODO App</h1>

    <div class="input-section">
      <input type="text" id="todoInput" placeholder="新しいTODOを入力...">
      <button id="addBtn">追加</button>
    </div>

    <div class="filter-section">
      <button class="filter-btn active" data-filter="all">全て</button>
      <button class="filter-btn" data-filter="active">未完了</button>
      <button class="filter-btn" data-filter="completed">完了済み</button>
    </div>

    <ul id="todoList"></ul>

    <div class="stats">
      <span id="todoCount">0件のTODO</span>
      <button id="clearCompleted">完了済みを削除</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
